[project]
name = "test2sql"
version = "0.1.0"
description = "Test2SQL —— 面向证券/银行业务人员的自然语言取数 Agent（三层架构 + 计划无关 ReAct 引擎）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "sqlglot>=23",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "fastmcp>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "faker>=25",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "eval: golden 集回归测试（改 prompt/工具后必跑）",
]
